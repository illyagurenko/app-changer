plugins {
    id 'java'
    id 'io.quarkus' version '3.26.4'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.26.4')

    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-kafka-client'
    implementation 'io.quarkus:quarkus-jackson'
    implementation 'io.quarkus:quarkus-arc'

    testImplementation 'io.quarkus:quarkus-junit5'
}

group = 'ru.itone.illya4gurenko'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.release = 25
}

compileTestJava {
    options.encoding = 'UTF-8'
    options.release = 25
}

// передача --add-opens для всех процессов запуска java в gradle
tasks.withType(JavaExec).configureEach {
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
}

// передача --add-opens для junit тестов
tasks.withType(Test).configureEach {
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
}

// передача --add-opens для dev режима quarkus
tasks.named('quarkusDev') {
    jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
}