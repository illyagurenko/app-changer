plugins {
    id 'java'
    id 'io.quarkus' version '3.26.4'
    id 'jacoco'
}

repositories {
    mavenCentral()
}

sourceSets {
    integrationTest {
        java {
            srcDirs = ['src/IntegrationTest/java', 'src/IntegrationTest']
        }
        resources {
            srcDirs = ['src/IntegrationTest/resources']
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += sourceSets.main.output + sourceSets.test.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    implementation enforcedPlatform('io.quarkus.platform:quarkus-bom:3.26.4')

    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-liquibase'
    implementation 'io.quarkus:quarkus-kafka-client'
    implementation 'io.quarkus:quarkus-jackson'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-jackson'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.quarkus:quarkus-jdbc-h2'
    testImplementation 'io.quarkus:quarkus-jacoco'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

group = 'ru.itone.illya4gurenko'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
    options.release = 25
}

compileTestJava {
    options.encoding = 'UTF-8'
    options.release = 25
}

// передача --add-opens для всех процессов запуска java в gradle
tasks.withType(JavaExec).configureEach {
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
}

// передача --add-opens для junit тестов
tasks.withType(Test).configureEach {
    jvmArgs("--add-opens=java.base/java.lang=ALL-UNNAMED")
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

task integrationTest(type: Test) {
    description = 'Runs integration tests.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
}

// передача --add-opens для dev режима quarkus
tasks.named('quarkusDev') {
    jvmArgs = ['--add-opens=java.base/java.lang=ALL-UNNAMED']
}