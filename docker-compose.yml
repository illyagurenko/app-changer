version: "3.8"

services:
  # 1. PostgreSQL для app-changer
  postgres-changer:
          image: postgres:16-alpine
          container_name: postgres_changer
          command: postgres -c timezone=Europe/Moscow -c synchronous_commit=off -c shared_buffers=512MB -c checkpoint_timeout=15min
          environment:
            POSTGRES_DB: changer_db
            POSTGRES_USER: changer_user
            POSTGRES_PASSWORD: root
            TZ: Europe/Moscow
          ports:
            - "5432:5432"
          networks:
            - default
            - food_bridge

  # 2. Apache Kafka KRaft режим
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: test_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://test_kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - default
      - food_bridge

  # 3. Сервис app-changer (Экземпляр 1 - Нода 161)
  app-changer-1:
    image: app-changer:latest
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: app_changer_1
    ports:
      - "8080:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://${PG_HOST_PRIMARY:-postgres_changer}:${PG_PORT_PRIMARY:-5432},${PG_HOST_STANDBY:-postgres_changer}:${PG_PORT_STANDBY:-5432}/changer_db?targetServerType=primary&connectTimeout=5&hostRecheckSeconds=10&options=-c%20timezone=Europe/Moscow"
      QUARKUS_DATASOURCE_USERNAME: changer_user
      QUARKUS_DATASOURCE_PASSWORD: root
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: 15s
      QUARKUS_DATASOURCE_JDBC_BACKGROUND_VALIDATION_INTERVAL: 30s
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER_PRIMARY:-test_kafka:29092},${KAFKA_BROKER_STANDBY:-test_kafka:29092}
      APP_NODE_ID: 161
      QUARKUS_LOG_CONSOLE_ENABLED: "true"
      TZ: Europe/Moscow
      DISPATCHER_URL: "http://host.docker.internal:8085/get-datasoure-by-account"
    depends_on:
      - postgres-changer
      - kafka
    restart: unless-stopped
    networks:
      - default
      - food_bridge

  # 4. Сервис app-changer (Экземпляр 2 - Нода 162)
  app-changer-2:
    image: app-changer:latest
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: app_changer_2
    ports:
      - "8081:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://${PG_HOST_PRIMARY:-postgres_changer}:${PG_PORT_PRIMARY:-5432},${PG_HOST_STANDBY:-postgres_changer}:${PG_PORT_STANDBY:-5432}/changer_db?targetServerType=primary&connectTimeout=5&hostRecheckSeconds=10&options=-c%20timezone=Europe/Moscow"
      QUARKUS_DATASOURCE_USERNAME: changer_user
      QUARKUS_DATASOURCE_PASSWORD: root
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: 15s
      QUARKUS_DATASOURCE_JDBC_BACKGROUND_VALIDATION_INTERVAL: 30s
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BROKER_PRIMARY:-test_kafka:29092},${KAFKA_BROKER_STANDBY:-test_kafka:29092}
      APP_NODE_ID: 162
      QUARKUS_LOG_CONSOLE_ENABLED: "true"
      TZ: Europe/Moscow
      DISPATCHER_URL: "http://host.docker.internal:8085/get-datasoure-by-account"
    depends_on:
      - postgres-changer
      - kafka
    restart: unless-stopped
    networks:
      - default
      - food_bridge

networks:
  default:
  food_bridge:
    external: true
