quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${PG_HOST_PRIMARY:localhost}:${PG_PORT_PRIMARY:5432},${PG_HOST_STANDBY:localhost}:${PG_PORT_STANDBY:5432}/changer_db?targetServerType=primary&connectTimeout=5&hostRecheckSeconds=10&options=-c%20timezone=Europe/Moscow
quarkus.datasource.username=changer_user
quarkus.datasource.password=root
quarkus.hibernate-orm.schema-generation.database.action=none

quarkus.datasource.jdbc.min-size=10
quarkus.datasource.jdbc.max-size=30
quarkus.datasource.jdbc.acquisition-timeout=15s
quarkus.datasource.jdbc.background-validation-interval=30s

quarkus.transaction-manager.default-transaction-timeout=300

quarkus.hibernate-orm.quote-identifiers.strategy=all

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

kafka.bootstrap-servers=${KAFKA_BROKER_PRIMARY:localhost:9092},${KAFKA_BROKER_STANDBY:localhost:9092}
kafka.group-id=app-changer-group

app.node-id=162

quarkus.kafka.devservices.enabled=false
quarkus.devservices.enabled=false

quarkus.log.console.enabled=false

quarkus.log.level=INFO

quarkus.log.category."ru.itone.illya4gurenko".level=DEBUG

quarkus.log.file.enabled=true
quarkus.log.file.path=logs/node-${app.node-id:162}/app.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n

quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd.gz
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=30
quarkus.log.file.rotation.rotate-on-boot=false